name: Run tests on macOS at 00:00 and manually
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  jest-test-on-macOs:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm install

      - name: Run Jest Test
        run: npx jest test.spec.ts
