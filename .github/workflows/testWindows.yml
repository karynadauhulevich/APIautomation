name: Run tests on Windows at 00:00 and manually
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  jest-test-on-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [ 18, 20 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix['node-version'] }}

      - name: Install npm dependencies
        run: npm install

      - name: Run Jest Test
        run: npx jest test.spec.ts